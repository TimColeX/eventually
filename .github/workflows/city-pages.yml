# Rebuilds the SEO city pages every day so they never show stale events.
#
# Stale pages are worse than no pages: someone who lands on "Events in Toronto" and finds
# last week's listings won't come back. The pages are generated from live Supabase data,
# so they have to be rebuilt on a schedule — this runs AFTER the 05:00 UTC event ingest so
# it always publishes the freshest inventory.
#
# NOTE ON PATHS: in the Pages repo the site IS the repo root (index.html, events/, sitemap.xml
# sit at the top level). The generator detects that automatically, so no edits are needed here.
#
# Only commits when the output actually changed, so the repo doesn't churn daily.
name: Rebuild city pages

on:
  schedule:
    - cron: '30 6 * * *'      # 06:30 UTC daily — after the 05:00 event ingest
  workflow_dispatch: {}        # plus a manual "Run workflow" button for testing

permissions:
  contents: write              # required so the job can push the rebuilt pages

concurrency:
  group: city-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate city pages
        # The anon key is the same public key already shipped in the frontend — it only
        # grants read access to approved events. Add a repo secret to override it.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tools/build-city-pages.js --top=50

      - name: Commit if anything changed
        run: |
          git config user.name  "eventually-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events browse sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No content changes — nothing to commit."
          else
            git commit -m "chore: rebuild city pages ($(date -u +%Y-%m-%d))"
            git push
          fi
