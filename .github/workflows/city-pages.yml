# Rebuilds the SEO city pages every day so they never show stale events.
#
# Stale pages are worse than no pages: someone who lands on "Events in Toronto" and finds
# last week's listings won't come back. The pages are generated from live Supabase data,
# so they have to be rebuilt on a schedule — this runs AFTER the 05:00 UTC event ingest so
# it always publishes the freshest inventory.
#
# NOTE ON PATHS: in the Pages repo the site IS the repo root (index.html, events/, sitemap.xml
# sit at the top level). The generator detects that automatically, so no edits are needed here.
#
# Only commits when the output actually changed, so the repo doesn't churn daily.
name: Rebuild city pages

on:
  schedule:
    # Every four hours, not once a day. Two reasons, and the second is the better one:
    #   1. An organiser who publishes an event and gets it approved had to wait up to a
    #      full day to see it on their city's page. (It is on the globe instantly — the
    #      page is the static SEO surface, rebuilt from live data.)
    #   2. The page only lists events that have not started yet, so a daily rebuild could
    #      leave something listed as upcoming twenty hours after it began.
    # A run that finds no change commits nothing, so most of these are no-ops. The repo
    # is public, so Actions minutes are free; the only real cost is the Supabase read.
    # NOTE: GitHub queues scheduled jobs on shared runners — observed runs have landed
    # 5–6 hours after the cron time, so treat these as "at the earliest", not "at".
    - cron: '30 */4 * * *'     # 00:30 / 04:30 / 08:30 / 12:30 / 16:30 / 20:30 UTC
  workflow_dispatch: {}        # plus a manual "Run workflow" button — use it after
                               # approving an event you want on its city page now

permissions:
  contents: write              # required so the job can push the rebuilt pages

concurrency:
  group: city-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Generate city pages
        # The anon key is the same public key already shipped in the frontend — it only
        # grants read access to approved events. Add a repo secret to override it.
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tools/build-city-pages.js --top=200

      - name: Commit if anything changed
        run: |
          git config user.name  "eventually-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events browse sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No content changes — nothing to commit."
          else
            git commit -m "chore: rebuild city pages ($(date -u +%Y-%m-%d))"
            git push
          fi
